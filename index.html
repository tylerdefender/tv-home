<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tvOS Outdoor Hub</title>
    <!-- Explicit Tizen TV core application metadata instructions -->
    <meta name="tizen-app-control" content="enable">
    <meta name="tizen-tvinputdevice" content="Left|Right|Up|Down|Enter">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; text-decoration: none; }
        html { font-size: calc(100vw / 120); }
        body {
            width: 100vw;
            height: 100vh;
            background: #212239 url(bg.jpg) center / cover no-repeat;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 5vh 0 8vh 0;
            -webkit-font-smoothing: antialiased;
        }
        #clock-container { position: relative; z-index: 2; text-align: center; margin-top: 10px; }
        #status-bar { font-size: 9rem; font-weight: 200; letter-spacing: -3px; color: #ffffff;  line-height: 1; }
        #ampm { font-size: 2.6rem; font-weight: 400; letter-spacing: 0; margin-left: 1.2rem; vertical-align: top; position: relative; top: 1.6rem; opacity: 0.85; }
        #toast { display: none; position: fixed; left: 5vw; right: 5vw; bottom: 2vh; padding: 14px 20px; border-radius: 12px; background: rgba(0,0,0,0.85); color: #fff; font-size: 1.1rem; z-index: 99; }
        #date-bar { font-size: 1.6rem; font-weight: 600; color: rgba(255, 255, 255, 0.85); text-transform: uppercase; letter-spacing: 3px; margin-top: 15px;  }
        .grid-container { position: relative; z-index: 2; display: flex; flex-direction: column; flex: 1; justify-content: center; width: 100%; align-items: center; padding-bottom: 6vh; }
        .row { display: flex; justify-content: center; margin: 2.5vh 0; }
        .row .tile { margin: 0 1.4vw; }
        
        .tile { position: relative; width: 14vw; height: 8.4vw; border-radius: 1.2vw; display: inline-flex; cursor: pointer; color: #fff; justify-content: center; align-items: center; box-shadow: 0 0 0 0 #ffffff; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); }
        .tile span { font-size: 1.5rem; font-weight: 700; color: #ffffff;  }
        
        .tile[data-app="netflix"] { background: #E50914; }
        .tile[data-app="prime"] { background: #00A8E1; }
        .tile[data-app="youtube"] { background: #FF0000; }
        .tile[data-app="hbo"] { background: linear-gradient(135deg, #002BE7 0%, #00041B 100%); }
        .tile[data-app="disney"] { background: linear-gradient(135deg, #021B79 0%, #0575E6 100%); }
        .tile[data-app="hulu"] { background: #1CE783; }
        .tile[data-app="hulu"] span { color: #000000;  }
        .tile[data-app="peacock"] { background: linear-gradient(135deg, #151518 0%, #2a2c35 100%); }
        
        .tile[data-app="spotify"] { background: #1DB954; }
        .tile[data-app="paramount"] { background: linear-gradient(135deg, #0064FF 0%, #002a6e 100%); }
        /* Direct visual ring scale focus */
        .tile.focused { box-shadow: 0 0 0 6px #ffffff; z-index: 10; }
    </style>
</head>
<body>

    <div id="clock-container">
        <div id="status-bar"><span id="clock">12:00</span><span id="ampm">AM</span></div>
        <div id="date-bar">Loading Date</div>
    </div>

    <div class="grid-container">
        <div class="row">
            <a class="tile" href="https://www.netflix.com" data-app="netflix" id="item-0-0"><span>Netflix</span></a>
            <a class="tile" href="https://www.primevideo.com" data-app="prime" id="item-0-1"><span>Prime Video</span></a>
            <a class="tile" href="https://www.youtube.com/tv" data-app="youtube" id="item-0-2"><span>YouTube</span></a>
            <a class="tile" href="https://www.max.com" data-app="hbo" id="item-0-3"><span>Max</span></a>
            <a class="tile" href="https://www.disneyplus.com" data-app="disney" id="item-0-4"><span>Disney+</span></a>
        </div>
        <div class="row">
            <a class="tile" href="https://www.hulu.com" data-app="hulu" id="item-1-0"><span>Hulu</span></a>
            <a class="tile" href="https://www.peacocktv.com" data-app="peacock" id="item-1-1"><span>Peacock</span></a>
            <a class="tile" href="https://open.spotify.com" data-app="spotify" id="item-1-2"><span>Spotify</span></a>
            <a class="tile" href="https://www.paramountplus.com" data-app="paramount" id="item-1-3"><span>Paramount+</span></a>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        var layout = [["netflix","prime","youtube","hbo","disney"],["hulu","peacock","spotify","paramount"]];
        var row = 0, col = 0;
        // Native app IDs from this TV (sdb shell 0 applist); only used when running as an installed Tizen app
        var appIds = { netflix: "org.tizen.netflix-app", prime: "org.tizen.primevideo", youtube: "9Ur5IzDKqV.TizenYouTube", hbo: "5b8c3eb16b.BeamCTVDev", disney: "MCmYXNxgcu.DisneyPlus", hulu: "LBUAQX1exg.Hulu", peacock: "gzcc4LRFBF.Peacock", spotify: "rJeHak5zRg.Spotify", paramount: "rJyOSqC6Up.CBSAllAccess" };

        function tile(r, c) { return document.getElementById("item-" + r + "-" + c); }
        function nearest(r) {
            var b = tile(row, col).getBoundingClientRect(), x = b.left + b.width / 2, best = 0, bd = 1e9;
            for (var i = 0; i < layout[r].length; i++) {
                var q = tile(r, i).getBoundingClientRect(), d = Math.abs(q.left + q.width / 2 - x);
                if (d < bd) { bd = d; best = i; }
            }
            return best;
        }
        var toastTimer;
        function toast(msg) {
            var el = document.getElementById("toast");
            el.textContent = msg; el.style.display = "block";
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { el.style.display = "none"; }, 8000);
        }
        function launchAny(ids, i, t, errs) {
            if (i >= ids.length) {
                if (t.getAttribute("href") !== "#") { location.href = t.href; return; }
                toast("Could not open " + t.textContent + " | " + errs.join(" | "));
                return;
            }
            try {
                tizen.application.launch(ids[i], function () {}, function (err) {
                    errs.push(ids[i] + ": " + (err && (err.name + " " + err.message)));
                    launchAny(ids, i + 1, t, errs);
                });
            } catch (x) {
                errs.push(ids[i] + ": " + x.name + " " + x.message);
                launchAny(ids, i + 1, t, errs);
            }
        }
        var cur = null;
        function setFocus(r, c) {
            row = r; col = c;
            var t = tile(r, c);
            if (cur === t) return;
            if (cur) cur.classList.remove("focused");
            t.classList.add("focused");
            cur = t;
        }

        var lastTime = "";
        function tick() {
            var d = new Date();
            var h = d.getHours(), m = d.getMinutes();
            var t = (h % 12 || 12) + ":" + (m < 10 ? "0" : "") + m;
            var ap = h < 12 ? "AM" : "PM";
            if (t + ap === lastTime) return;
            lastTime = t + ap;
            document.getElementById("clock").textContent = t;
            document.getElementById("ampm").textContent = ap;
            document.getElementById("date-bar").textContent = d.toLocaleDateString("en-US", {weekday: "long", month: "long", day: "numeric"});
        }

        window.onload = function () {
            try { ["Left","Right","Up","Down","Enter"].forEach(function (k) { tizen.tvinputdevice.registerKey(k); }); } catch (e) {}
            tick(); setInterval(tick, 10000);
            setFocus(0, 0);
            // Pointer hover also moves the tracked position so arrow keys continue from the cursor
            Array.prototype.forEach.call(document.querySelectorAll(".tile"), function (t) {
                t.addEventListener("mouseenter", function () {
                    var p = t.id.split("-");
                    setFocus(+p[1], +p[2]);
                });
                t.addEventListener("click", function (e) {
                    var ids = appIds[t.getAttribute("data-app")];
                    if (typeof tizen === "undefined" || !ids) return; // plain browser: follow the link
                    e.preventDefault();
                    launchAny([].concat(ids), 0, t, []);
                });
            });
        };

        document.addEventListener("keydown", function (e) {
            if (e.keyCode === 13) { e.preventDefault(); tile(row, col).click(); return; }
            var r = row, c = col;
            if (e.keyCode === 37 && c > 0) c--;
            else if (e.keyCode === 39 && c < layout[r].length - 1) c++;
            else if (e.keyCode === 38 && r > 0) { r--; c = nearest(r); }
            else if (e.keyCode === 40 && r < layout.length - 1) { r++; c = nearest(r); }
            else return;
            e.preventDefault();
            setFocus(r, c);
        });
    </script>
</body>
</html>
