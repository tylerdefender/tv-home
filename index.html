<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tvOS Outdoor Hub</title>
    <!-- Explicit Tizen TV core application metadata instructions -->
    <meta name="tizen-app-control" content="enable">
    <meta name="tizen-tvinputdevice" content="Left|Right|Up|Down|Enter">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; text-decoration: none; }
        html { font-size: calc(100vw / 120); }
        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to top, rgba(10,11,15,0.8) 0%, rgba(10,11,15,0) 30%), linear-gradient(170deg, transparent 65%, #181c26 65.2%), linear-gradient(195deg, transparent 58%, #202b36 58.2%), linear-gradient(165deg, transparent 48%, #273340 48.2%), radial-gradient(circle at 65% 48%, #ffb366 0%, rgba(255,179,102,0.2) 20%, transparent 50%), linear-gradient(to top, #484b6a 0%, #212239 100%);
            background-size: cover;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 5vh 0 8vh 0;
            -webkit-font-smoothing: antialiased;
        }
        #clock-container { position: relative; z-index: 2; text-align: center; margin-top: 10px; }
        #status-bar { font-size: 9rem; font-weight: 200; letter-spacing: -3px; color: #ffffff; text-shadow: 0 4px 35px rgba(0, 0, 0, 0.6); line-height: 1; }
        #date-bar { font-size: 1.6rem; font-weight: 600; color: rgba(255, 255, 255, 0.85); text-transform: uppercase; letter-spacing: 3px; margin-top: 15px; text-shadow: 0 2px 15px rgba(0,0,0,0.5); }
        .grid-container { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 35px; width: 100%; align-items: center; }
        .row { display: flex; gap: 30px; justify-content: center; }
        
        .tile { position: relative; width: 14vw; height: 8.4vw; border-radius: 1.2vw; display: inline-flex; cursor: pointer; color: #fff; justify-content: center; align-items: center; transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); box-shadow: 0 20px 40px rgba(0,0,0,0.6); overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); }
        .tile span { font-size: 1.5rem; font-weight: 700; color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        
        .tile[data-app="netflix"] { background: #E50914; }
        .tile[data-app="prime"] { background: #00A8E1; }
        .tile[data-app="youtube"] { background: #FF0000; }
        .tile[data-app="hbo"] { background: linear-gradient(135deg, #002BE7 0%, #00041B 100%); }
        .tile[data-app="disney"] { background: linear-gradient(135deg, #021B79 0%, #0575E6 100%); }
        .tile[data-app="hulu"] { background: #1CE783; }
        .tile[data-app="hulu"] span { color: #000000; text-shadow: none; }
        .tile[data-app="peacock"] { background: linear-gradient(135deg, #151518 0%, #2a2c35 100%); }
        
        /* Direct visual ring scale focus */
        .tile:hover, .tile:focus, .tile.focused { transform: scale(1.22); box-shadow: 0 40px 80px rgba(0, 0, 0, 0.85); outline: 6px solid #ffffff !important; outline-offset: 4px; z-index: 10; }
    </style>
</head>
<body>

    <div id="clock-container">
        <div id="status-bar">00:00</div>
        <div id="date-bar">Loading Date</div>
    </div>

    <div class="grid-container">
        <div class="row">
            <a class="tile" href="https://www.netflix.com" data-app="netflix" id="item-0-0"><span>Netflix</span></a>
            <a class="tile" href="https://www.primevideo.com" data-app="prime" id="item-0-1"><span>Prime Video</span></a>
            <a class="tile" href="https://www.youtube.com/tv" data-app="youtube" id="item-0-2"><span>YouTube</span></a>
            <a class="tile" href="https://www.max.com" data-app="hbo" id="item-0-3"><span>Max</span></a>
        </div>
        <div class="row">
            <a class="tile" href="https://www.disneyplus.com" data-app="disney" id="item-1-0"><span>Disney+</span></a>
            <a class="tile" href="https://www.hulu.com" data-app="hulu" id="item-1-1"><span>Hulu</span></a>
            <a class="tile" href="https://www.peacocktv.com" data-app="peacock" id="item-1-2"><span>Peacock</span></a>
        </div>
    </div>

    <script>
        var layout = [["netflix","prime","youtube","hbo"],["disney","hulu","peacock"]];
        var row = 0, col = 0;
        // Best-effort Tizen native app IDs (only used when running as an installed Tizen app)
        var appIds = { netflix: "11101200001", youtube: "111299001912", prime: "3201512006785", disney: "3201901017640" };

        function tile(r, c) { return document.getElementById("item-" + r + "-" + c); }
        function setFocus(r, c) { row = r; col = c; tile(r, c).focus(); }

        function tick() {
            var d = new Date();
            document.getElementById("status-bar").innerText = d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", hour12: false});
            document.getElementById("date-bar").innerText = d.toLocaleDateString("en-US", {weekday: "long", month: "long", day: "numeric"});
        }

        window.onload = function () {
            try { ["Left","Right","Up","Down","Enter"].forEach(function (k) { tizen.tvinputdevice.registerKey(k); }); } catch (e) {}
            tick(); setInterval(tick, 1000);
            setFocus(0, 0);
            // Pointer hover also moves the tracked position so arrow keys continue from the cursor
            Array.prototype.forEach.call(document.querySelectorAll(".tile"), function (t) {
                t.addEventListener("mouseenter", function () {
                    var p = t.id.split("-"); row = +p[1]; col = +p[2];
                    t.focus();
                });
                t.addEventListener("click", function (e) {
                    var id = appIds[t.getAttribute("data-app")];
                    try { tizen.application.launch(id, function () {}, function () { location.href = t.href; }); e.preventDefault(); } catch (x) {}
                });
            });
        };

        document.addEventListener("keydown", function (e) {
            var r = row, c = col;
            if (e.keyCode === 37 && c > 0) c--;
            else if (e.keyCode === 39 && c < layout[r].length - 1) c++;
            else if (e.keyCode === 38 && r > 0) r--;
            else if (e.keyCode === 40 && r < layout.length - 1) r++;
            else return;
            if (c >= layout[r].length) c = layout[r].length - 1;
            e.preventDefault();
            setFocus(r, c);
        });
    </script>
</body>
</html>
